[package]
name = "todo-kanban-core"
version = "2.0.0"
description = "todo-kanban 纯逻辑库（无 tauri 依赖，可独立单测、可被 MCP server 复用）"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
# 附件：id 生成（uuid v4）+ 前端 base64 图片解码（均在既有 lock 内，编译增量小）
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
todo-kanban-upgrade = { path = "../upgrade" }