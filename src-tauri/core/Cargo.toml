[package]
name = "todo-kanban-core"
version = "2.0.0"
description = "todo-kanban 纯逻辑库（无 tauri 依赖，可独立单测、可被 MCP server 复用）"
license = "Apache-2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
log = "0.4"
# 附件：id 生成（uuid v4）+ 前端 base64 图片解码（均在既有 lock 内，编译增量小）
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# 自定义字段的本地日期时间（today / {{date}} / datetime 文本解析）：走本地时区，避免 UTC 跨日偏差
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
todo-kanban-upgrade = { path = "../upgrade" }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
