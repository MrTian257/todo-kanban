[package]
name = "todo-kanban"
version = "2.0.0"
description = "面向开发者的泳道看板待办管理（Tauri 2）"
authors = ["todo-kanban"]
edition = "2021"

[lib]
# `_lib` 后缀为 Windows Cargo#8519 所需：避免与 bin 名冲突
name = "todo_kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
# 右键菜单「粘贴」依赖：读系统剪贴板（前端经 plugin:clipboard-manager|read_text 调用）
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
todo-kanban-core = { path = "core" }

[workspace]
members = ["config", "core", "upgrade", "mcp-server"]
resolver = "2"
