[package]
name = "mcp-server"
version = "2.0.0"
description = "todo-kanban MCP server（stdio，零 tauri/MCP-SDK 依赖）"
edition = "2021"

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
todo-kanban-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"