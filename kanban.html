<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目看板</title>
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --border:#e4e7ec;
    --text:#1f2430;
    --text-soft:#6b7280;
    --accent:#0d9488;
    --accent-soft:#ccfbf1;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
    --shadow-md:0 4px 12px rgba(16,24,40,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* Header */
  .app-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
    background:linear-gradient(135deg,#0f766e,#0d9488);
    color:#fff;
    box-shadow:var(--shadow-md);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.5px}
  .brand .logo{
    width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;font-size:16px;
  }
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:14px;
    border-radius:10px;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{background:rgba(255,255,255,.95);color:#0f766e;font-weight:600;padding:9px 16px}
  .btn-primary:hover{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}

  /* Board */
  .board{
    flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;padding:22px;align-items:start;
  }
  @media (max-width:880px){ .board{grid-template-columns:1fr;gap:16px;padding:14px} }

  .column{
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--radius);display:flex;flex-direction:column;
    max-height:calc(100dvh - 110px);
  }
  @media (max-width:880px){ .column{max-height:none} }

  .col-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;position:sticky;top:0;
  }
  .col-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.todo{background:#94a3b8}
  .dot.doing{background:#f59e0b}
  .dot.done{background:#10b981}
  .count{
    background:#e5e7eb;color:#475569;font-size:12px;font-weight:600;
    min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px;
  }
  .add-col{
    background:transparent;color:var(--text-soft);width:30px;height:30px;
    border-radius:8px;font-size:20px;line-height:1;display:grid;place-items:center;
  }
  .add-col:hover{background:#eceef1;color:var(--text)}

  .col-body{
    padding:6px 12px 14px;overflow-y:auto;display:flex;flex-direction:column;
    gap:10px;min-height:60px;flex:1;
  }
  .col-body.drag-over{background:var(--accent-soft);border-radius:10px}
  .col-body::-webkit-scrollbar{width:8px}
  .col-body::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}

  /* Card */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 13px;box-shadow:var(--shadow-sm);cursor:grab;
    transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease;
    position:relative;
  }
  .card:hover{box-shadow:var(--shadow-md);border-color:#cdd2da;transform:translateY(-1px)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card-title{font-size:14.5px;font-weight:600;line-height:1.4;padding-right:22px;word-break:break-word}
  .card-desc{font-size:12.5px;color:var(--text-soft);margin-top:6px;line-height:1.5;word-break:break-word}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
  .badge{
    font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;line-height:1;
  }
  .badge.high{background:#fee2e2;color:#dc2626}
  .badge.medium{background:#fef3c7;color:#d97706}
  .badge.low{background:#d1fae5;color:#059669}

  .assignee{display:flex;align-items:center;gap:7px}
  .avatar{
    width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;
    display:grid;place-items:center;flex-shrink:0;
  }
  .assignee-name{font-size:12px;color:var(--text-soft);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .del{
    position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;
    border:none;background:transparent;color:#c2c7d0;cursor:pointer;font-size:14px;
    display:grid;place-items:center;opacity:0;transition:opacity .15s ease,background .15s ease,color .15s ease;
  }
  .card:hover .del{opacity:1}
  .del:hover{background:#fee2e2;color:#dc2626}

  .empty{
    text-align:center;color:#b6bcc6;font-size:13px;padding:22px 10px;
    border:1.5px dashed #d7dbe2;border-radius:10px;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .modal-backdrop.open{display:flex}
  .modal{
    background:var(--surface);width:100%;max-width:440px;border-radius:16px;
    box-shadow:0 20px 50px rgba(16,24,40,.3);overflow:hidden;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:18px 20px;font-size:16px;font-weight:700;border-bottom:1px solid var(--border)}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-soft)}
  .field input,.field textarea,.field select{
    font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);
    border-radius:9px;background:var(--surface-2);color:var(--text);outline:none;transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff;
  }
  .field textarea{resize:vertical;min-height:70px}
  .row{display:flex;gap:14px}
  .row .field{flex:1}
  .modal-foot{padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border)}
  .btn-ghost{background:var(--surface-2);color:var(--text-soft);padding:9px 16px;border:1px solid var(--border)}
  .btn-ghost:hover{background:#eceef1}
  .btn-save{background:var(--accent);color:#fff;padding:9px 18px;font-weight:600}
  .btn-save:hover{background:#0f766e}

  .err{color:#dc2626;font-size:12px;display:none}
  .err.show{display:block}
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="logo">▦</span>项目看板</div>
    <button class="btn btn-primary" id="addGlobal">+ 新增卡片</button>
  </header>

  <main class="board" id="board"></main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head" id="modalTitle">新增卡片</div>
      <div class="modal-body">
        <div class="field">
          <label for="f-title">标题</label>
          <input id="f-title" type="text" placeholder="输入任务标题" maxlength="60">
          <span class="err" id="err-title">请填写标题</span>
        </div>
        <div class="field">
          <label for="f-desc">描述</label>
          <textarea id="f-desc" placeholder="补充说明（可选）" maxlength="200"></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label for="f-priority">优先级</label>
            <select id="f-priority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="field">
            <label for="f-assignee">负责人</label>
            <input id="f-assignee" type="text" placeholder="姓名" maxlength="20">
          </div>
        </div>
        <div class="field">
          <label for="f-column">所在列</label>
          <select id="f-column">
            <option value="todo">待办</option>
            <option value="doing">进行中</option>
            <option value="done">已完成</option>
          </select>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancelBtn">取消</button>
        <button class="btn btn-save" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "kanban-data-v1";
  const COLUMNS = [
    {id:"todo",  name:"待办",   cls:"todo"},
    {id:"doing", name:"进行中", cls:"doing"},
    {id:"done",  name:"已完成", cls:"done"}
  ];
  const PRIORITY = {
    high:  {label:"高", cls:"high"},
    medium:{label:"中", cls:"medium"},
    low:   {label:"低", cls:"low"}
  };

  let cards = load();
  let draggedId = null;
  let editingId = null;

  const board = document.getElementById("board");
  const modal = document.getElementById("modal");
  const fTitle = document.getElementById("f-title");
  const fDesc = document.getElementById("f-desc");
  const fPriority = document.getElementById("f-priority");
  const fAssignee = document.getElementById("f-assignee");
  const fColumn = document.getElementById("f-column");
  const errTitle = document.getElementById("err-title");

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ const d = JSON.parse(raw); if(Array.isArray(d)) return d; }
    }catch(e){ console.warn("读取本地数据失败", e); }
    return seed();
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }
    catch(e){ console.warn("保存失败", e); }
  }
  function seed(){
    return [
      {id:uid(),column:"todo", title:"需求评审", desc:"梳理本周迭代需求并拆解任务", priority:"high", assignee:"张伟"},
      {id:uid(),column:"todo", title:"竞品调研", desc:"整理 3 款同类产品的功能对比", priority:"low", assignee:"李娜"},
      {id:uid(),column:"doing",title:"接口联调", desc:"对接用户中心与权限服务", priority:"high", assignee:"王强"},
      {id:uid(),column:"doing",title:"看板原型", desc:"完成拖拽交互的高保真原型", priority:"medium", assignee:"陈静"},
      {id:uid(),column:"done", title:"项目立项", desc:"确定范围、里程碑与负责人", priority:"medium", assignee:"赵磊"}
    ];
  }

  function avatarColor(name){
    const palette = ["#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f97316"];
    let h = 0;
    for(const ch of (name||"?")) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    return palette[h % palette.length];
  }
  function initial(name){
    if(!name || !name.trim()) return "?";
    return name.trim().charAt(0);
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]
    ));
  }

  function render(){
    board.innerHTML = "";
    COLUMNS.forEach(col => {
      const list = cards.filter(c => c.column === col.id);
      const section = document.createElement("section");
      section.className = "column";
      section.innerHTML =
        '<div class="col-head">' +
          '<div class="col-title"><span class="dot '+col.cls+'"></span>' + col.name +
          ' <span class="count">'+list.length+'</span></div>' +
          '<button class="add-col" data-col="'+col.id+'" title="新增到本列">+</button>' +
        '</div>' +
        '<div class="col-body" data-col="'+col.id+'"></div>';
      const body = section.querySelector(".col-body");
      if(list.length === 0){
        body.innerHTML = '<div class="empty">暂无卡片，拖入或点击 + 添加</div>';
      }else{
        list.forEach(c => body.appendChild(buildCard(c)));
      }
      body.addEventListener("dragover", onDragOver);
      body.addEventListener("dragleave", onDragLeave);
      body.addEventListener("drop", onDrop);
      section.querySelector(".add-col").addEventListener("click", () => openModal(null, col.id));
      board.appendChild(section);
    });
  }

  function buildCard(c){
    const p = PRIORITY[c.priority] || PRIORITY.medium;
    const el = document.createElement("article");
    el.className = "card";
    el.draggable = true;
    el.dataset.id = c.id;
    const av = '<div class="avatar" style="background:'+avatarColor(c.assignee)+'">'+esc(initial(c.assignee))+'</div>';
    const name = c.assignee ? '<span class="assignee-name">'+esc(c.assignee)+'</span>' : "";
    el.innerHTML =
      '<button class="del" title="删除" data-del="1">×</button>' +
      '<div class="card-title">'+esc(c.title)+'</div>' +
      (c.desc ? '<div class="card-desc">'+esc(c.desc)+'</div>' : '') +
      '<div class="card-foot">' +
        '<span class="badge '+p.cls+'">'+p.label+'</span>' +
        '<div class="assignee">'+av+name+'</div>' +
      '</div>';
    el.addEventListener("dragstart", e => {
      draggedId = c.id;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", c.id);
    });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); draggedId = null; });
    el.addEventListener("click", e => {
      if(e.target.dataset.del) return;
      openModal(c.id);
    });
    el.querySelector(".del").addEventListener("click", e => {
      e.stopPropagation();
      removeCard(c.id);
    });
    return el;
  }

  function getDragAfterElement(container, y){
    const els = [...container.querySelectorAll(".card:not(.dragging)")];
    let closest = {offset:Number.NEGATIVE_INFINITY, element:null};
    for(const child of els){
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset){
        closest = {offset, element:child};
      }
    }
    return closest.element;
  }
  function onDragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    this.classList.add("drag-over");
  }
  function onDragLeave(e){
    if(!this.contains(e.relatedTarget)) this.classList.remove("drag-over");
  }
  function onDrop(e){
    e.preventDefault();
    this.classList.remove("drag-over");
    const targetCol = this.dataset.col;
    const id = draggedId || e.dataTransfer.getData("text/plain");
    if(!id) return;
    const after = getDragAfterElement(this, e.clientY);
    const beforeId = after ? after.dataset.id : null;
    moveCard(id, targetCol, beforeId);
  }

  function moveCard(id, targetCol, beforeId){
    const idx = cards.findIndex(c => c.id === id);
    if(idx === -1) return;
    const [card] = cards.splice(idx, 1);
    card.column = targetCol;
    if(beforeId){
      const bIdx = cards.findIndex(c => c.id === beforeId);
      if(bIdx === -1) cards.push(card);
      else cards.splice(bIdx, 0, card);
    }else{
      cards.push(card);
    }
    save();
    render();
  }

  function removeCard(id){
    const c = cards.find(x => x.id === id);
    if(!c) return;
    if(!confirm('确认删除卡片「'+c.title+'」？')) return;
    cards = cards.filter(x => x.id !== id);
    save();
    render();
  }

  /* Modal */
  function openModal(id, presetCol){
    editingId = id || null;
    document.getElementById("modalTitle").textContent = id ? "编辑卡片" : "新增卡片";
    errTitle.classList.remove("show");
    if(id){
      const c = cards.find(x => x.id === id);
      fTitle.value = c.title;
      fDesc.value = c.desc || "";
      fPriority.value = c.priority;
      fAssignee.value = c.assignee || "";
      fColumn.value = c.column;
    }else{
      fTitle.value = "";
      fDesc.value = "";
      fPriority.value = "medium";
      fAssignee.value = "";
      fColumn.value = presetCol || "todo";
    }
    modal.classList.add("open");
    setTimeout(() => fTitle.focus(), 50);
  }
  function closeModal(){
    modal.classList.remove("open");
    editingId = null;
  }
  function saveModal(){
    const title = fTitle.value.trim();
    if(!title){ errTitle.classList.add("show"); fTitle.focus(); return; }
    const data = {
      title,
      desc: fDesc.value.trim(),
      priority: fPriority.value,
      assignee: fAssignee.value.trim(),
      column: fColumn.value
    };
    if(editingId){
      const c = cards.find(x => x.id === editingId);
      Object.assign(c, data);
    }else{
      cards.push(Object.assign({id:uid()}, data));
    }
    save();
    render();
    closeModal();
  }

  document.getElementById("addGlobal").addEventListener("click", () => openModal(null, "todo"));
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  document.getElementById("saveBtn").addEventListener("click", saveModal);
  modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && modal.classList.contains("open")) closeModal();
    if(e.key === "Enter" && modal.classList.contains("open") && e.target.tagName !== "TEXTAREA") saveModal();
  });

  render();
})();
</script>
</body>
</html>
