<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>可拖拽项目看板</title>
    <link rel="stylesheet" href="../../src/mainview/index.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span class="logo">▦</span><span>项目看板</span></div>
      <div class="header-center">
        <span id="projectTitle" class="project-title">—</span>
      </div>
      <button class="btn btn-primary" id="addTaskBtn">+ 新增任务</button>
    </header>

    <div id="layout">
      <aside id="sidebar">
        <div class="sidebar-head">
          <h3>项目</h3>
          <button class="btn btn-ghost btn-sm" id="newProjectBtn">+ 新建项目</button>
        </div>
        <ul id="projectList"></ul>
        <div id="sidebarEmpty" class="empty-side">暂无项目</div>
      </aside>

      <main id="boardArea">
        <div id="board"></div>
        <div id="boardEmpty" class="empty-board">
          <div class="empty-board-inner">
            <p>还没有项目,点击「+ 新建项目」开始创建你的第一个看板吧</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Project modal -->
    <div class="modal-backdrop" id="projectModal">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head" id="projectModalTitle">新增项目</div>
        <div class="modal-body">
          <div class="field">
            <label for="f-pname">项目名称</label>
            <input id="f-pname" type="text" placeholder="输入项目名称" maxlength="60" />
            <span class="err" id="err-pname">请填写项目名称</span>
          </div>
          <div class="field">
            <label for="f-pdesc">项目描述</label>
            <textarea id="f-pdesc" placeholder="补充说明(可选)" maxlength="500"></textarea>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelProjectBtn">取消</button>
          <button class="btn btn-save" id="saveProjectBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- Task modal -->
    <div class="modal-backdrop" id="taskModal">
      <div class="modal modal-wide" role="dialog" aria-modal="true">
        <div class="modal-head" id="taskModalTitle">新增任务</div>
        <div class="modal-body">
          <div class="field">
            <label for="f-ttitle">标题</label>
            <input id="f-ttitle" type="text" placeholder="输入任务标题" maxlength="80" />
            <span class="err" id="err-ttitle">请填写任务标题</span>
          </div>
          <div class="field">
            <label>详细描述(Markdown)</label>
            <div class="md-tabs">
              <button type="button" class="md-tab active" id="tabEdit">编辑</button>
              <button type="button" class="md-tab" id="tabPreview">预览</button>
            </div>
            <textarea id="f-tdesc" placeholder="支持 Markdown:## 标题、- 列表、``` 代码块、**加粗** 等" maxlength="10000"></textarea>
            <div id="mdPreview" class="md-preview hidden"></div>
          </div>
          <div class="row">
            <div class="field">
              <label for="f-tpriority">优先级</label>
              <select id="f-tpriority">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </div>
            <div class="field">
              <label for="f-tassignee">负责人</label>
              <input id="f-tassignee" type="text" placeholder="姓名" maxlength="20" />
            </div>
          </div>
          <div class="field">
            <label for="f-tstatus">所在列</label>
            <select id="f-tstatus">
              <option value="todo">待办</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
            </select>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelTaskBtn">取消</button>
          <button class="btn btn-save" id="saveTaskBtn">保存</button>
        </div>
      </div>
    </div>

    <script>
// ── electrobun/view module shims (must exist before the view bundle loads) ──
window.__electrobunWebviewId = undefined;
window.__electrobunRpcSocketPort = undefined;
window.__electrobun = { receiveMessageFromBun: null };

// ── Mock KanbanApi — mirrors the real electrobun RPC surface ─────────────
(function () {
  "use strict";
  let nextProjectId = 100;
  let nextTaskId = 1000;
  const now = "2026-08-05 00:00:00";

  const projects = [
    { id: 1, name: "示例项目", description: "演示项目", created_at: now, updated_at: now },
    { id: 2, name: "第二项目", description: "", created_at: now, updated_at: now },
  ];
  const tasks = [
    { id: 10, project_id: 1, title: "需求评审", description: "## 目标\n\n梳理本周迭代需求", status: "todo", priority: "high", assignee: "张伟", position: 0, created_at: now, updated_at: now },
    { id: 11, project_id: 1, title: "接口联调", description: "```ts\nconst x = 1;\n```", status: "doing", priority: "high", assignee: "王强", position: 0, created_at: now, updated_at: now },
    { id: 12, project_id: 1, title: "项目立项", description: "- [x] 确定范围\n- [ ] 里程碑", status: "done", priority: "medium", assignee: "赵磊", position: 0, created_at: now, updated_at: now },
    { id: 13, project_id: 2, title: "第二项目任务", description: "", status: "todo", priority: "low", assignee: "", position: 0, created_at: now, updated_at: now },
  ];
  const calls = [];
  window.__calls = calls;

  const clone = (o) => JSON.parse(JSON.stringify(o));

  const api = {
    getProjects: async () => clone(projects),
    createProject: async ({ name, description }) => {
      calls.push(["createProject", { name, description }]);
      const p = { id: ++nextProjectId, name, description: description || "", created_at: now, updated_at: now };
      projects.push(p);
      return clone(p);
    },
    updateProject: async ({ id, name, description }) => {
      calls.push(["updateProject", { id, name, description }]);
      const p = projects.find((x) => x.id === id);
      if (!p) return null;
      if (name !== undefined) p.name = name;
      if (description !== undefined) p.description = description;
      p.updated_at = now;
      return clone(p);
    },
    deleteProject: async ({ id }) => {
      calls.push(["deleteProject", { id }]);
      const before = tasks.length;
      for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i].project_id === id) tasks.splice(i, 1);
      const idx = projects.findIndex((x) => x.id === id);
      if (idx >= 0) projects.splice(idx, 1);
      return { deletedTasks: before - tasks.length };
    },
    getTasks: async ({ projectId }) => clone(tasks.filter((t) => t.project_id === projectId)),
    getTask: async ({ id }) => clone(tasks.find((t) => t.id === id) ?? null),
    createTask: async (input) => {
      calls.push(["createTask", input]);
      const status = input.status || "todo";
      const max = Math.max(-1, ...tasks.filter((t) => t.project_id === input.projectId && t.status === status).map((t) => t.position));
      const t = {
        id: ++nextTaskId,
        project_id: input.projectId,
        title: input.title,
        description: input.description || "",
        status,
        priority: input.priority || "medium",
        assignee: input.assignee || "",
        position: max + 1,
        created_at: now,
        updated_at: now,
      };
      tasks.push(t);
      return clone(t);
    },
    updateTask: async ({ id, ...patch }) => {
      calls.push(["updateTask", { id, ...patch }]);
      const t = tasks.find((x) => x.id === id);
      if (!t) return null;
      if (patch.title !== undefined) t.title = patch.title;
      if (patch.description !== undefined) t.description = patch.description;
      if (patch.priority !== undefined) t.priority = patch.priority;
      if (patch.assignee !== undefined) t.assignee = patch.assignee;
      t.updated_at = now;
      return clone(t);
    },
    setTaskStatus: async ({ id, status }) => {
      calls.push(["setTaskStatus", { id, status }]);
      const t = tasks.find((x) => x.id === id);
      if (!t) return null;
      t.status = status;
      t.updated_at = now;
      return clone(t);
    },
    moveTask: async ({ id, status, beforeId }) => {
      calls.push(["moveTask", { id, status, beforeId }]);
      const task = tasks.find((x) => x.id === id);
      if (!task) return null;
      const target = status || task.status;
      // same reorder semantics as shared/db.ts moveTask
      const others = tasks.filter((t) => t.project_id === task.project_id && t.status === target && t.id !== id)
        .sort((a, b) => a.position - b.position || a.id - b.id);
      const order = [];
      let inserted = false;
      for (const t of others) {
        if (!inserted && beforeId !== null && beforeId !== undefined && t.id === beforeId) {
          order.push(id);
          inserted = true;
        }
        order.push(t.id);
      }
      if (!inserted) order.push(id);
      task.status = target;
      order.forEach((tid, i) => {
        const t = tasks.find((x) => x.id === tid);
        if (t) t.position = i;
      });
      if (target !== task.status) { /* status unchanged in mock after assignment above; renumber source below */
      }
      return clone(task);
    },
    deleteTask: async ({ id }) => {
      calls.push(["deleteTask", { id }]);
      const idx = tasks.findIndex((x) => x.id === id);
      if (idx >= 0) tasks.splice(idx, 1);
      return { success: idx >= 0 };
    },
    getStats: async ({ projectId } = {}) => {
      const list = projectId ? tasks.filter((t) => t.project_id === projectId) : tasks;
      return {
        projects: projects.length,
        total: list.length,
        todo: list.filter((t) => t.status === "todo").length,
        doing: list.filter((t) => t.status === "doing").length,
        done: list.filter((t) => t.status === "done").length,
      };
    },
  };
  window.__KANBAN_API__ = api;
})();
</script>
    <script type="module" src="index.js"></script>
  </body>
</html>
