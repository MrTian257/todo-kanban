[package]
name = "todo-kanban"
version = "2.0.0"
description = "面向开发者的泳道看板待办管理（Tauri 2）"
authors = ["todo-kanban"]
license = "Apache-2.0"
edition = "2021"

[lib]
# `_lib` 后缀为 Windows Cargo#8519 所需：避免与 bin 名冲突
name = "todo_kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# 仅测试用：MCP HTTP 集成测试要直接播种 app_meta（版本与 core 一致，复用同一份编译产物）
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
# 右键菜单「粘贴」依赖：读系统剪贴板（前端经 plugin:clipboard-manager|read_text 调用）
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
todo-kanban-core = { path = "core" }
# 局域网共享：内嵌 HTTP 服务（访客面板 + REST + SSE 实时推送）
axum = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# 局域网访问地址展示：枚举本机网卡 IPv4
if-addrs = "0.13"

# macOS：接管 applicationShouldTerminate: 让 Dock「退出」也走保存保护
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[workspace]
members = ["config", "core", "upgrade", "mcp-server"]
resolver = "2"
